name: "Update Data"

on:
  schedule:
    - cron: "0 20 * * *"
      timezone: "Europe/London"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OBSIDIAN_PASSWORD: ${{ secrets.OBSIDIAN_PASSWORD }}
      OBSIDIAN_EMAIL: ${{ secrets.OBSIDIAN_EMAIL }}
      REAL_NAME: ${{ secrets.REAL_NAME }}
      TODOOIST_AUTH_TOKEN: ${{ secrets.TODOOIST_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 25

      - name: Cache notes
        uses: actions/cache@v6
        with:
          path: tmp/vault
          key: notes-backup

      - run: echo "::add-mask::$REAL_NAME"
      - run: npm ci

      - name: Update notes
        run: npm run update:data:notes

      - name: Update tasks
        run: npm run update:data:tasks

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Chore: updated data"
