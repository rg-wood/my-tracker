name: Update Data

on:
  pull_request:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OBSIDIAN_PASSWORD: ${{ secrets.OBSIDIAN_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 25

      - name: Restore Notes Backup
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: notes-backup

      - run: npm ci
      - run: npm run update:data

      - name: Backup Notes
        uses: actions/upload-artifact@v4
        with:
          name: notes-backup
          path: tmp/vault
          retention-days: 5

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Chore: updated data for today"
