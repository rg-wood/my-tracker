name: Deploy

on:
  push:
    branches: [main]
  workflow_call:

jobs:
  deploy_pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 25
      - run: npm ci
      - run: npm run build

      - run: touch dist/.nojekyll
      - name: Deploy to Pages 🚀
        uses: JamesIves/github-pages-deploy-action@releases/v4
        with:
          folder: dist
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
